<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Value Matrix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/customer-value-matrix.css">
    <!-- Load D3.js instead of Chart.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/js/customer-value-matrix.js" defer></script>
</head>
<body>
    <h1 style="text-align: center; font-family: 'Inter', sans-serif; font-weight: 800; color: #1e293b; margin-top: 20px;">Customer Value Matrix</h1>
    
    <div class="chart-container" style="position: relative;">
        <!-- Circle Packing SVG -->
        <svg id="cvmChart" style="width:100%; height:100%; min-height: 480px;" viewBox="0 0 850 550" preserveAspectRatio="xMidYMid meet"></svg>
        
        <!-- Custom Tooltip -->
        <div id="cvmTooltip" class="custom-tooltip"></div>
    </div>

    <!-- Legend -->
    <div class="legend-container">
        <div class="legend-item">
            <span class="legend-dot" style="background-color: #10b981;"></span>
            <span>Dễ thắng + Giá trị cao (Easy to Win + High Value)</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background-color: #3b82f6;"></span>
            <span>Khó thắng + Giá trị cao (Hard to Win + High Value)</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background-color: #f59e0b;"></span>
            <span>Dễ thắng + Giá trị thấp (Easy to Win + Low Value)</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background-color: #ef4444;"></span>
            <span>Khó thắng + Giá trị thấp (Hard to Win + Low Value)</span>
        </div>
    </div>
</body>
</html>
